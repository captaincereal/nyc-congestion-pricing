name: Backfill

on:
  schedule:
    - cron: '25 1,7,13,19 * * *'
  workflow_dispatch:
    inputs:
      budget_minutes:
        description: Shared verification-first source runtime (maximum 300 minutes)
        default: '285'
      slice_minutes:
        description: Publish durable receipts and day checkpoints after this many minutes
        default: '12'

concurrency:
  group: socrata-backfill
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  backfill:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -e .
      - name: Restore legacy in-flight day checkpoints
        uses: actions/cache/restore@v4
        with:
          path: data/raw/ezpass_days
          key: ezpass-days-${{ github.run_id }}
          restore-keys: ezpass-days-
      - name: Verify original inputs, then deepen the frozen pre-period
        env:
          GH_TOKEN: ${{ github.token }}
          NYC_OPENDATA_APP_TOKEN: ${{ secrets.NYC_OPENDATA_APP_TOKEN }}
          SOURCE_BUDGET_MIN: ${{ inputs.budget_minutes || '285' }}
          SOURCE_SLICE_MIN: ${{ inputs.slice_minutes || '12' }}
        run: python -m src.data.hosted_backfill
      - name: Preserve in-flight checkpoints after interruption
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/raw/ezpass_days
          key: ezpass-days-${{ github.run_id }}
      - name: Check for backfill milestones
        if: always()
        run: python -m scripts.announce_milestones

      - name: Open a notification issue for each milestone, once
        # This runs on every six-hourly pass, so each milestone is checked
        # against existing issues rather than reopened.
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          for body in outputs/milestones/*.md; do
            key=$(basename "$body" .md)
            title=$(cat "outputs/milestones/$key.title")
            found=$(gh issue list --state all --search "$title" --json title --jq "length")
            if [ "$found" != "0" ]; then
              echo "already announced: $key"
              continue
            fi
            gh issue create --title "$title" --body-file "$body"
            echo "announced: $key"
          done



      - name: Preserve source report, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-status-${{ github.run_id }}
          path: outputs/tables/source_status.json
          if-no-files-found: warn
