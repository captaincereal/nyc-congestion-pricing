name: H010

# Dispatch only, and that is the point. H010 is a pre-registered hypothesis
# against a fixed dataset, so every execution is another draw. analysis.yml
# fires on backfill completion and on pushes under src/analysis/, which would
# re-answer it silently and repeatedly. This runs when a person asks it to.
on:
  workflow_dispatch:
    inputs:
      allow_rerun:
        description: >-
          Overwrite existing H010 artefacts. Only if you mean to take a second
          draw, and record that you did.
        type: boolean
        default: false

concurrency:
  group: h010-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -e .
      - name: Run H010 and commit its artefacts
        env:
          RESULTS_BRANCH: ${{ github.ref_name }}
        run: >-
          python -m scripts.run_h010
          ${{ inputs.allow_rerun && '--allow-rerun' || '' }}
