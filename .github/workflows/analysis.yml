name: Analysis

# Rebuilds the panel and reruns Phases 6-8 whenever new data lands or the
# analysis code changes, then commits the tables and figures.
#
# The point is that results track the data without anyone running anything.
# Every pass answers "does the pre-trend test clear yet", which is the gate on
# whether this study can quote a number at all, and writes the answer into
# outputs/tables/pretrend_tests.csv where the next pass can compare against it.

on:
  workflow_run:
    workflows: [Backfill]
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'src/analysis/**'
      - 'src/data/build_panel.py'
      - 'src/data/build_staging.py'
      - 'src/data/geo.py'
      - 'sql/**'
  workflow_dispatch:

concurrency:
  group: analysis
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - run: pip install -e .

      - name: Fetch the raw parts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          chmod +x scripts/*.sh
          scripts/data_release.sh pull

      - name: Stage, assign treatment, build the panel
        run: |
          python -m src.data.build_staging
          python -m src.data.geo
          python -m src.data.build_panel

      - name: Data quality report
        run: python -m src.data.quality_report

      - name: Phase 6 — descriptives
        run: python -m src.analysis.descriptive

      - name: Phase 7 — difference-in-differences
        run: |
          python -m src.analysis.did
          python -m src.analysis.did --weather

      # Each sample writes its own row into pretrend_tests.csv. Off-peak is the
      # cut that fails hardest on the short window, so it is the one to watch.
      - name: Phase 8 — event study
        run: |
          for sample in all peak offpeak weekend; do
            python -m src.analysis.event_study --sample "$sample"
          done

      - name: Publish the rebuilt panel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload data-raw data/processed/hourly_panel.parquet --clobber \
            || echo "panel upload skipped"

      - name: Commit the results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A outputs docs/data_quality_report.md
          if git diff --cached --quiet; then
            echo "results unchanged"
            exit 0
          fi
          MSG="Regenerated from the months the backfill has landed so far."
          MSG="$MSG See the run summary for the pre-trend verdict, which gates"
          MSG="$MSG whether any of this is quotable."
          git commit -m "Rerun the analysis on the current data" -m "$MSG"
          git pull --rebase --autostash
          git push

      - name: Report where the study stands
        if: always()
        run: python -m src.data.coverage_report >> "$GITHUB_STEP_SUMMARY"
