name: H003 aggregation

on:
  workflow_run:
    workflows: [Backfill]
    types: [completed]
  schedule:
    - cron: '47 * * * *'
  workflow_dispatch:

concurrency:
  group: h003-aggregation
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  aggregate:
    if: >-
      github.event.repository.private == false &&
      (github.event_name != 'workflow_run' ||
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -e .
      - name: Run the registered fixed-snapshot sensitivity only after the source gate
        env:
          GH_TOKEN: ${{ github.token }}
          RESULTS_BRANCH: main
        run: python -m scripts.run_hosted_analysis --hypothesis H003
      - name: Preserve results and failures even if publishing fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: H003-${{ github.run_id }}
          path: outputs/tables/H003_*
          if-no-files-found: ignore
