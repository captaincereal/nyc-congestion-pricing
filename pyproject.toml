[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nyc-congestion-pricing"
version = "0.1.0"
description = "Causal impact of NYC congestion pricing (2025-01-05) on traffic speeds in the Congestion Relief Zone"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Hanu Varma Pinaramaju", email = "hanu.p098@gmail.com" }]

# Phase 1-3 dependencies only. Modelling libraries (linearmodels, etc.) are
# added in Phase 7 when the analysis needs them - see docs/methodology.md.
dependencies = [
    "pandas>=2.1",
    "numpy>=1.26",
    "pyarrow>=14.0",       # parquet I/O for raw + processed
    "duckdb>=1.1",         # large tabular transforms (staging, panel, QC)
    "requests>=2.31",      # Socrata downloads
    "tenacity>=8.2",       # retry/backoff on the API
    "python-dotenv>=1.0",  # load a gitignored .env (Socrata token, data dir)
    "shapely>=2.0",        # CRZ polygon membership (Phase 5)
    "tabulate>=0.9",       # DataFrame.to_markdown for generated reports
    "matplotlib>=3.8",     # diagnostics / QC plots
    "statsmodels>=0.14",   # descriptive + baseline models (Phase 6+)
    "diff-diff>=3.12",     # Rambachan-Roth sensitivity (H002); maintained HonestDiD port
    "pyyaml>=6.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "black>=24.0",
    "mypy>=1.11",
    "jupyter>=1.0",
    "pre-commit>=3.8",
    "types-requests",
    "types-PyYAML",
]

[project.urls]
Repository = "https://github.com/captaincereal/nyc-congestion-pricing"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PD"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=src --cov-report=term-missing"
